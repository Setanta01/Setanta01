name: Generate GitHub Stats with Private Repos

on:
  schedule:
    - cron: "0 */6 * * *" # Atualiza a cada 6h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Stats Card
        run: |
          curl -H "Authorization: token ${{ secrets.PAT_1 }}" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=setanta01&layout=compact&theme=tokyonight&count_private=true" \
            -o stats-langs.svg

      - name: Verify file
        run: |
          ls -lh stats-langs.svg
          file stats-langs.svg || true

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add stats-langs.svg
          git commit -m "Update stats-langs.svg" || echo "No changes to commit"
          git push
