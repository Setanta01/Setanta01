name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@v3
        with:
          username: setanta01
          count_private: true
          hide: contribs
          theme: tokyonight
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_1 }}

      - name: Commit stats SVG
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update stats with private repos" || echo "No changes to commit"
          git push
